server {
    listen 80 default_server;
    server_name wb.ka1shen.cn;

    client_max_body_size 200m;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location /app { proxy_pass http://127.0.0.1:8902; proxy_set_header Host $host; }
    location /wb  { proxy_pass http://127.0.0.1:8902; proxy_set_header Host $host; }
    location /static { proxy_pass http://127.0.0.1:8902; proxy_set_header Host $host; }
    location = / { return 302 /app/; }
    location / { proxy_pass http://127.0.0.1:8902; proxy_set_header Host $host;
                 proxy_read_timeout 300s; proxy_send_timeout 300s; }
}

server {
    listen 443 ssl http2;
    server_name wb.ka1shen.cn;

    client_max_body_size 200m;

    ssl_certificate /etc/letsencrypt/live/wb.ka1shen.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wb.ka1shen.cn/privkey.pem;

    location /app { proxy_pass http://127.0.0.1:8902; proxy_set_header Host $host; }
    location /wb  { proxy_pass http://127.0.0.1:8902; proxy_set_header Host $host; }
    location /static { proxy_pass http://127.0.0.1:8902; proxy_set_header Host $host; }
    location = / { return 302 /app/; }
    location / { proxy_pass http://127.0.0.1:8902; proxy_set_header Host $host;
                 proxy_read_timeout 300s; proxy_send_timeout 300s; }
}
